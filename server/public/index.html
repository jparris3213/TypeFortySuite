<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entry Form & List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <section class="form-section">
            <h2>Add Entry</h2>
            <form id="entryForm">

                <label for="Entry_No">Entry No</label>
                <input type="number" id="Entry_No" name="Entry_No" required>

                <label for="Name">Name</label>
                <input type="text" id="Name" name="Name" required>

                <label for="Type">Type</label>
                <input type="text" id="Type" name="Type" required>

                <label for="Line">Line</label>
                <input type="number" id="Line" name="Line">

                <label for="Note">Note</label>
                <textarea id="Note" name="Note" rows="3"></textarea>

                <button type="submit">Submit</button>
            </form>
            <div id="formMsg" style="color:green; margin-top:1rem;"></div>
        </section>
        <section class="table-section">
            <h2>Entries</h2>
            <table id="entriesTable">
                <thead>
                    <tr>
                        <th>Entry No</th>
                        <th>Name</th>
                        <th>Type</th>
                        <th>Line</th>
                        <th>Note</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Entries will be populated here -->
                </tbody>
            </table>
        </section>
    </div>
    <script>
        const API_URL = '/scripts'; // Updated to match backend endpoint

        async function fetchEntries() {
            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error('Failed to fetch');
                return await res.json();
            } catch (e) {
                return [];
            }
        }

        function renderEntries(entries) {
            const tbody = document.querySelector('#entriesTable tbody');
            tbody.innerHTML = '';
            entries.forEach(entry => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${entry.Entry_No}</td>
                    <td>${entry.Name}</td>
                    <td>${entry.Type}</td>
                    <td>${entry.Line}</td>
                    <td>${entry.Note}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function loadEntries() {
            const entries = await fetchEntries();
            renderEntries(entries);
        }

        document.getElementById('entryForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const form = e.target;
            const data = {
                Entry_No: parseInt(form.Entry_No.value, 10),
                Name: form.Name.value.trim(),
                Type: form.Type.value.trim(),
                Line: form.Line.value ? parseInt(form.Line.value, 10) : null,
                Note: form.Note.value.trim()
            };
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (!res.ok) throw new Error('Failed to submit');
                document.getElementById('formMsg').textContent = 'Entry added!';
                form.reset();
                loadEntries();
            } catch (err) {
                document.getElementById('formMsg').textContent = 'Error adding entry.';
            }
            setTimeout(() => document.getElementById('formMsg').textContent = '', 2000);
        });

        // Initial load
        loadEntries();
    </script>
</body>
</html>
