<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Script Column Text Entry</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8f9fa;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            min-width: 600px;
        }
        label {
            font-weight: bold;
            margin-bottom: 1rem;
            display: block;
        }
        #scriptTextArea {
            width: 100%;
            height: 400px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12pt;
            padding: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
            box-sizing: border-box;
            background: repeating-linear-gradient(
                to right,
                #fff 0 33%,
                #f0f0f0 33% 66%,
                #fff 66% 100%
            );
        }
        .column-indicator {
            margin-bottom: 1rem;
            font-size: 1rem;
        }
        .column-indicator span {
            display: inline-block;
            width: 80px;
            text-align: center;
            padding: 0.2em 0.5em;
            border-radius: 4px;
            background: #eee;
            margin-right: 0.5em;
        }
        .column-indicator .active {
            background: #007bff;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="column-indicator" id="area-indicator">
            <span id="area-label">LOCATION</span>
        </div>
        <label for="scriptEditor">Type your script below. Use Tab/Enter to move between areas.</label>
        <div id="scriptEditor" contenteditable="true" spellcheck="false" style="width:100%;min-height:400px;font-family:'Courier New',monospace;font-size:12pt;padding:1rem;border:1px solid #ccc;border-radius:4px;background:#fff;box-sizing:border-box;outline:none;line-height:1.5;max-width:700px;margin:auto;box-shadow:0 2px 8px rgba(0,0,0,0.07);"></div>
    </div>
    <script src="index.js"></script>
</body>
</html>
