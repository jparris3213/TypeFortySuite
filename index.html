<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Script Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="column-indicator" id="area-indicator">
            <span id="area-label">LOCATION</span>
        </div>
        <label for="scriptEditor">Type your script below. Use Tab/Enter to move between areas.</label>
        <div id="scriptEditor" spellcheck="false" tabindex="0"></div>    
        <div class="export-btn-container">
        <button id="exportBtn">Export</button>
    </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
