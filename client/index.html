<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Script Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="top-nav">
        <a href="#" id="nav-export-pdf">Export to PDF</a>
        <a href="#" id="nav-export-json">Export to JSON</a>
        <a href="#" id="nav-import-json">Import from JSON</a>
    </nav>
    <div class="container-row">
        <div id="sidebar" style="width: 180px; min-width: 120px; background: #f0f0f0; border-radius: 8px 0 0 8px; margin-right: 1.5rem; padding: 1rem 0; display: flex; flex-direction: column; align-items: stretch;">
            <div style="font-weight: bold; text-align: center; margin-bottom: 1em;">Scenes</div>
            <div id="scene-list"></div>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column;">
            <div class="column-indicator" id="area-indicator">
                <span id="area-label">LOCATION</span>
            </div>
            <label for="scriptEditor">Type your script below. Use Tab/Enter to move between areas.</label>
            <div id="scriptEditor" spellcheck="false" tabindex="0"></div>
        </div>
        <div id="characterbar" style="width: 180px; min-width: 120px; background: #f0f0f0; border-radius: 0 8px 8px 0; margin-left: 1.5rem; padding: 1rem 0; display: flex; flex-direction: column; align-items: stretch;">
            <div style="font-weight: bold; text-align: center; margin-bottom: 1em;">Characters</div>
            <div id="character-list"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
